# Production overlay. Combine it with compose.yaml:
#   docker compose -f deploy/compose.yaml -f deploy/compose.production.yaml up -d
# Set the required image and secret variables in the deployment environment first.
# Set HTTP_PORT=80 and HTTPS_PORT=443 for the usual public web addresses.
# Do not use the example development passwords or secret values in production.

services:
  db:
    # This versioned image tag keeps production on a known pgvector/PostgreSQL release.
    image: pgvector/pgvector:0.8.0-pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB for production}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER for production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong POSTGRES_PASSWORD for production}
    restart: unless-stopped

  proxy:
    # Use the reviewed proxy image prepared for this release.
    image: ${PROXY_IMAGE:?Set PROXY_IMAGE to a reviewed version or immutable image digest}
    build: null
    restart: unless-stopped

  frontend:
    # Prebuild and review this image; production does not build from source.
    image: ${FRONTEND_IMAGE:?Set FRONTEND_IMAGE to a reviewed version or immutable image digest}
    build: null
    restart: unless-stopped

  api:
    image: ${API_IMAGE:?Set API_IMAGE to a reviewed version or immutable image digest}
    build: null
    environment:
      APP_ENV: production
      # The database host should be "db" when using the private Compose database.
      DATABASE_URL: ${DATABASE_URL:?Set the production DATABASE_URL}
      SESSION_SECRET_KEY: ${SESSION_SECRET_KEY:?Set a strong SESSION_SECRET_KEY}
      WORKER_SHARED_SECRET: ${WORKER_SHARED_SECRET:?Set a strong WORKER_SHARED_SECRET}
      MODEL_PROVIDER: ${MODEL_PROVIDER:?Set the approved MODEL_PROVIDER}
      MODEL_PROVIDER_API_KEY: ${MODEL_PROVIDER_API_KEY:?Set MODEL_PROVIDER_API_KEY}
      OIDC_ISSUER: ${OIDC_ISSUER:?Set OIDC_ISSUER}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?Set OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?Set OIDC_CLIENT_SECRET}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:?Set the public OIDC_REDIRECT_URI}
    restart: unless-stopped

  worker:
    image: ${API_IMAGE:?Set API_IMAGE to a reviewed version or immutable image digest}
    build: null
    environment:
      APP_ENV: production
      # The database host should be "db" when using the private Compose database.
      DATABASE_URL: ${DATABASE_URL:?Set the production DATABASE_URL}
      SESSION_SECRET_KEY: ${SESSION_SECRET_KEY:?Set a strong SESSION_SECRET_KEY}
      WORKER_SHARED_SECRET: ${WORKER_SHARED_SECRET:?Set a strong WORKER_SHARED_SECRET}
      MODEL_PROVIDER: ${MODEL_PROVIDER:?Set the approved MODEL_PROVIDER}
      MODEL_PROVIDER_API_KEY: ${MODEL_PROVIDER_API_KEY:?Set MODEL_PROVIDER_API_KEY}
      OIDC_ISSUER: ${OIDC_ISSUER:?Set OIDC_ISSUER}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?Set OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?Set OIDC_CLIENT_SECRET}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:?Set the public OIDC_REDIRECT_URI}
    restart: unless-stopped

  migrate:
    image: ${API_IMAGE:?Set API_IMAGE to a reviewed version or immutable image digest}
    build: null
