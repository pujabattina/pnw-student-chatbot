# Local development setup. Run from the repository root with:
#   docker compose -f deploy/compose.yaml up --build
# Docker Compose starts the database, runs migrations once, then starts the app.
name: pnw-student-chatbot

services:
  # PostgreSQL stores application data. It has no published port, so it is not
  # directly reachable from outside Docker.
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pnw_chatbot}
      POSTGRES_USER: ${POSTGRES_USER:-pnw_chatbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only}
    volumes:
      # A named volume keeps database contents when containers are replaced.
      - postgres_data:/var/lib/postgresql/data
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  # The only service with public ports; it will route website and /api traffic.
  # Its routing rules are added separately in deploy/proxy/nginx.conf (T009).
  proxy:
    image: nginx:1.29.1-alpine
    ports:
      # Local browser addresses are http://localhost:8080 and https://localhost:8443.
      # Set HTTP_PORT=80 and HTTPS_PORT=443 on a deployment server.
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      # Read-only means the proxy can use, but cannot change, its routing rules.
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Supply a trusted TLS certificate and private key in deploy/certs/.
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - api
    networks:
      - app

  # Builds the React website files; the proxy sends normal website requests here.
  frontend:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
    networks:
      - app

  # Runs the private API used by the website and background worker.
  api:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://pnw_chatbot:local_dev_only@db:5432/pnw_chatbot}
      SESSION_SECRET_KEY: ${SESSION_SECRET_KEY:-local-development-only}
      WORKER_SHARED_SECRET: ${WORKER_SHARED_SECRET:-local-development-only}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-}
      MODEL_PROVIDER_API_KEY: ${MODEL_PROVIDER_API_KEY:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-http://localhost:8080/api/v1/auth/callback}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - app
      - database

  # Runs background source-import jobs separately from student API requests.
  worker:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    command: ["python", "-m", "app.worker.runner"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://pnw_chatbot:local_dev_only@db:5432/pnw_chatbot}
      SESSION_SECRET_KEY: ${SESSION_SECRET_KEY:-local-development-only}
      WORKER_SHARED_SECRET: ${WORKER_SHARED_SECRET:-local-development-only}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-}
      MODEL_PROVIDER_API_KEY: ${MODEL_PROVIDER_API_KEY:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-http://localhost:8080/api/v1/auth/callback}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - app
      - database

  # This one-time setup task prepares the database before the API and worker run.
  migrate:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://pnw_chatbot:local_dev_only@db:5432/pnw_chatbot}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - database

volumes:
  postgres_data:
    # Docker manages this storage separately from short-lived containers.

networks:
  app:
    # App-to-app traffic; only the proxy publishes ports on the host.
  database:
    # Keeping this network internal prevents direct outside access to PostgreSQL.
    internal: true
