[project]
name = "pnw-student-chatbot"
version = "0.1.0"
description = "Backend for the PNW Student Information Chatbot"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14,<2",
    "asyncpg>=0.30,<1",
    "fastapi>=0.115,<1",
    "fastembed>=0.8.1",
    "greenlet>=3.1,<4",
    "httpx>=0.28,<1",
    "itsdangerous>=2.2,<3",
    "openai>=3.24.0",
    "pgvector>=0.3,<1",
    "pydantic>=2.10,<3",
    "PyJWT[crypto]>=2.10,<3",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.21,<1",
    "mypy>=1.14,<2",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
    "pyyaml>=6.0,<7",
    "ruff>=0.9,<1",
]

[tool.mypy]
python_version = "3.12"
files = ["app"]
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.uv]
package = false
