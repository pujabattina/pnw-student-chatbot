openapi: 3.1.0
info:
  title: PNW Student Information Chatbot API
  version: 1.0.0-draft
  description: Public anonymous chat and institutional reviewer API. Student prompts are not persisted.
servers:
  - url: /api/v1
paths:
  /auth/me:
    get:
      summary: Return the signed-in reviewer's display authorization state
      operationId: getCurrentReviewer
      security: [{ oidc: [] }]
      responses:
        '200':
          description: Current institutional reviewer identity and allowed roles
          content:
            application/json:
              schema:
                type: object
                required: [subject, roles]
                properties:
                  subject: { type: string }
                  roles:
                    type: array
                    items: { type: string, enum: [reviewer, source_owner, admin, conflict_resolver] }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /chat/answers:
    post:
      summary: Return a grounded answer, context question, or safe referral
      operationId: createAnswer
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: A normal conversational outcome
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatOutcome'
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/Throttled' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /review/sources:
    get:
      summary: List source governance records
      operationId: listSources
      security: [{ oidc: [reviewer] }]
      responses:
        '200': { description: Source list }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Register a candidate source
      operationId: createSource
      security: [{ oidc: [source_owner] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SourceInput' }
      responses:
        '201': { description: Candidate source created }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /review/sources/{sourceId}:
    get:
      summary: Read source, versions, approvals, and audit history
      operationId: getSource
      security: [{ oidc: [reviewer] }]
      parameters: [{ $ref: '#/components/parameters/SourceId' }]
      responses:
        '200': { description: Source governance record }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Source not found }
    patch:
      summary: Update owner or effective context for a non-active candidate
      operationId: updateSource
      security: [{ oidc: [source_owner] }]
      parameters: [{ $ref: '#/components/parameters/SourceId' }]
      responses:
        '200': { description: Source updated and audited }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /review/sources/{sourceId}/approve:
    post:
      summary: Approve or reapprove the current source version
      operationId: approveSource
      security: [{ oidc: [source_owner] }]
      parameters: [{ $ref: '#/components/parameters/SourceId' }]
      responses:
        '200': { description: Current version approved and eligible for retrieval }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Version is not eligible for approval }
  /review/sources/{sourceId}/disable:
    post:
      summary: Disable the source version from retrieval
      operationId: disableSource
      security: [{ oidc: [source_owner] }]
      parameters: [{ $ref: '#/components/parameters/SourceId' }]
      responses:
        '200': { description: Source disabled atomically and audited }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /review/referrals:
    get:
      summary: List active and inactive referrals
      operationId: listReferrals
      security: [{ oidc: [reviewer] }]
      responses:
        '200': { description: Referral list }
    post:
      summary: Create a scoped referral backed by an approved source
      operationId: createReferral
      security: [{ oidc: [source_owner] }]
      responses:
        '201': { description: Referral created and audited }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /internal/sources/{sourceId}/change-events:
    post:
      summary: Record a worker-detected change or withdrawal and disable retrieval
      operationId: recordChangeEvent
      security: [{ workerKey: [] }]
      parameters: [{ $ref: '#/components/parameters/SourceId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangeEvent' }
      responses:
        '200': { description: Current approval disabled atomically }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /health:
    get:
      summary: Minimal readiness and liveness status
      operationId: getHealth
      security: []
      responses:
        '200': { description: Ready }
        '503': { $ref: '#/components/responses/Unavailable' }
components:
  securitySchemes:
    oidc:
      type: openIdConnect
      openIdConnectUrl: https://idp.pnw.example/.well-known/openid-configuration
    workerKey:
      type: apiKey
      in: header
      name: X-Worker-Key
  parameters:
    SourceId:
      name: sourceId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    BadRequest: { description: Malformed request; no request body is retained }
    Unauthenticated: { description: Institutional authentication required }
    Forbidden: { description: Authenticated identity lacks the required role }
    Throttled: { description: Anonymous request rate limit reached }
    Unavailable: { description: Service cannot safely complete the request }
  schemas:
    ChatRequest:
      type: object
      required: [question]
      properties:
        question: { type: string, minLength: 1, maxLength: 4000 }
        context: { $ref: '#/components/schemas/QuestionContext' }
    QuestionContext:
      type: object
      properties:
        campus: { type: string, enum: [Hammond, Westville] }
        college: { type: string, maxLength: 120 }
        program: { type: string, maxLength: 160 }
        course: { type: string, maxLength: 40 }
        academicTerm: { type: string, maxLength: 40 }
    ChatOutcome:
      oneOf:
        - $ref: '#/components/schemas/SupportedAnswer'
        - $ref: '#/components/schemas/ClarificationNeeded'
        - $ref: '#/components/schemas/ReferralOutcome'
      discriminator: { propertyName: outcome }
    SupportedAnswer:
      type: object
      required: [outcome, answer, citations, appliedContext]
      properties:
        outcome: { const: supported }
        answer: { type: string }
        citations:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/Citation' }
        appliedContext: { $ref: '#/components/schemas/QuestionContext' }
    ClarificationNeeded:
      type: object
      required: [outcome, question, missingFields]
      properties:
        outcome: { const: clarification_needed }
        question: { type: string }
        missingFields:
          type: array
          items: { type: string, enum: [campus, program, course, academicTerm] }
    ReferralOutcome:
      type: object
      required: [outcome, limitation, reason, referrals]
      properties:
        outcome: { const: referral }
        limitation: { type: string }
        reason:
          type: string
          enum: [unsupported, conflicting, outdated, account_specific, uninterpretable, timeout]
        referrals:
          type: array
          items: { $ref: '#/components/schemas/Referral' }
    Citation:
      type: object
      required: [sourceId, title, url]
      properties:
        sourceId: { type: string, format: uuid }
        title: { type: string }
        url: { type: string, format: uri }
        locator: { type: string }
    Referral:
      type: object
      required: [name]
      properties:
        name: { type: string }
        url: { type: string, format: uri }
        email: { type: string, format: email }
        phone: { type: string }
    SourceInput:
      type: object
      required: [canonicalUrl, title, ownerSubject, effectiveContext]
      properties:
        canonicalUrl: { type: string, format: uri }
        title: { type: string }
        ownerSubject: { type: string }
        effectiveContext: { type: object }
    ChangeEvent:
      type: object
      required: [observedAt, contentFingerprint, event]
      properties:
        observedAt: { type: string, format: date-time }
        contentFingerprint: { type: string }
        event: { type: string, enum: [changed, withdrawn] }
